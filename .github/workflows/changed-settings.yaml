name: Check for changed settings

on:
  workflow_call:
    inputs:
      version_file:
        description: Repo-relative path to the file that contains version information
        required: true
        type: string
      version_regexp:
        description: The regexp pattern to extract version from the version file. The first capturing group must contain the released version tag present in repository_url.
        required: true
        type: string
      version_transform:
        description: Optional string used to transform the tag captured by version_regexp. This can for example add a 'v' in front of the tag. The {} is replaced with the captured tag.
        default: '{}'
        required: false
        type: string
    secrets:
      SUBLIMELSP_APP_PRIVATE_KEY:
        description: Private key of the SublimeLSP App, which opens the settings PR.
        required: false
    outputs:
      version_changed:
        description: Set to 'true' if version has changed relative to the main branch.
        value: ${{ jobs.changed_settings.outputs.version_changed }}
      new_version:
        description: Set to the tag of the new version.
        value: ${{ jobs.changed_settings.outputs.new_version }}
      settings_changed:
        description: Set to 'true' if settings have changed between versions, 'false' if output was "No changes".
        value: ${{ jobs.changed_settings.outputs.settings_changed }}

permissions:
  contents: read
  pull-requests: write

jobs:
  changed_settings:
    # The settings PR is stacked on top of the PR, so this workflow must not run for it.
    if: ${{ !startsWith(github.head_ref, 'settings/') }}
    runs-on: ubuntu-latest
    env:
      # PRs from forks get a read-only token and no secrets, so the settings PR and the comment are skipped for them.
      IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      # The branch to stack the settings PR on: the PR's branch, or the branch the workflow was dispatched on.
      BRANCH: ${{ github.head_ref || github.ref_name }}
      SETTINGS_BRANCH: settings/${{ github.head_ref || github.ref_name }}

    outputs:
      version_changed: ${{ steps.version-check.outputs.version_changed }}
      new_version: ${{ steps.tag-to.outputs.version }}
      settings_changed: ${{ steps.settings-changed-check.outputs.settings_changed }}

    steps:
      - name: Check for the app key
        if: env.IS_FORK == 'false'
        env:
          HAS_KEY: ${{ secrets.SUBLIMELSP_APP_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != 'true' ]; then
            echo "::error::SUBLIMELSP_APP_PRIVATE_KEY is not available. Pass it to this workflow in \`secrets\`."
            exit 1
          fi

      # Pushes and PRs made with GITHUB_TOKEN don't trigger workflows, so the settings PR wouldn't get CI.
      - uses: actions/create-github-app-token@v3
        id: app-token
        if: env.IS_FORK == 'false'
        with:
          client-id: ${{ vars.SUBLIMELSP_APP_CLIENT_ID }}
          private-key: ${{ secrets.SUBLIMELSP_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Get version from default branch
        id: tag-from
        env:
          FILE: ${{ inputs.version_file }}
          VERSION: ${{ inputs.version_regexp }}
        run: echo "version=$(rg -o "$VERSION" -r "\$1" "$FILE")" >> "$GITHUB_OUTPUT"

      - name: Checkout PR
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          token: ${{ steps.app-token.outputs.token || github.token }}
          path: pr

      - name: Get version from PR
        id: tag-to
        working-directory: pr
        env:
          FILE: ${{ inputs.version_file }}
          VERSION: ${{ inputs.version_regexp }}
        run: echo "version=$(rg -o "$VERSION" -r "\$1" "$FILE")" >> "$GITHUB_OUTPUT"

      - id: version-check
        env:
          VERSION_FROM: ${{ steps.tag-from.outputs.version }}
          VERSION_TO: ${{ steps.tag-to.outputs.version }}
        run: |
          if [ "$VERSION_FROM" != "$VERSION_TO" ]; then echo 'version_changed=true'; else echo 'version_changed=false'; fi >> "$GITHUB_OUTPUT"

      # The same commit as this workflow, so that the script matches it.
      - if: steps.version-check.outputs.version_changed == 'true'
        name: Checkout workflow repo
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: workflow-repo

      - if: steps.version-check.outputs.version_changed == 'true'
        name: Setup uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          working-directory: workflow-repo

      - if: steps.version-check.outputs.version_changed == 'true'
        name: Run changed_settings script
        id: changed-settings
        working-directory: pr
        env:
          VERSION_FROM: ${{ steps.tag-from.outputs.version }}
          VERSION_TO: ${{ steps.tag-to.outputs.version }}
          VERSION_TRANSFORM: ${{ inputs.version_transform }}
        run: |
          TRANSFORMED_FROM="${VERSION_TRANSFORM//\{\}/$VERSION_FROM}"
          TRANSFORMED_TO="${VERSION_TRANSFORM//\{\}/$VERSION_TO}"

          echo "transformed_from: ${TRANSFORMED_FROM}"
          echo "transformed_to: ${TRANSFORMED_TO}"

          uv run --project ../workflow-repo ../workflow-repo/scripts/changed_settings.py \
            "$TRANSFORMED_FROM" \
            "$TRANSFORMED_TO" > "$RUNNER_TEMP/changes.md"
          cat "$RUNNER_TEMP/changes.md" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$(git status --porcelain)" ]; then echo 'changed=true'; else echo 'changed=false'; fi >> "$GITHUB_OUTPUT"

      - if: steps.version-check.outputs.version_changed == 'true'
        name: Check for changes
        id: settings-changed-check
        run: |
          if grep -q "No changes" "$RUNNER_TEMP/changes.md"; then
            echo "settings_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "settings_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update settings PR
        id: settings-pr
        if: env.IS_FORK == 'false' && steps.changed-settings.outputs.changed == 'true'
        working-directory: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'chore: update settings'
          git push --force origin "HEAD:refs/heads/$SETTINGS_BRANCH"
          target=${PR_NUMBER:+#$PR_NUMBER}
          target=${target:-$BRANCH}
          {
            echo "Settings changes for $target. Review them, then merge this PR before $target."
            echo
            echo "This branch is regenerated when $target is updated, which overwrites any changes pushed to it."
            echo
            cat "$RUNNER_TEMP/changes.md"
          } > "$RUNNER_TEMP/body.md"
          number=$(gh pr list --head "$SETTINGS_BRANCH" --base "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh pr edit "$number" --body-file "$RUNNER_TEMP/body.md"
          else
            url=$(gh pr create --head "$SETTINGS_BRANCH" --base "$BRANCH" --title "chore: update settings for $target" --body-file "$RUNNER_TEMP/body.md")
            number=${url##*/}
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # Also when the version no longer changes, e.g. after the version bump was reverted.
      - name: Close stale settings PR
        if: env.IS_FORK == 'false' && steps.changed-settings.outputs.changed != 'true'
        working-directory: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          number=$(gh pr list --head "$SETTINGS_BRANCH" --base "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh pr close "$number" --delete-branch --comment "No settings changes needed anymore."
          fi

      - name: Write comment
        if: env.IS_FORK == 'false' && env.PR_NUMBER != '' && steps.version-check.outputs.version_changed == 'true'
        env:
          SETTINGS_PR: ${{ steps.settings-pr.outputs.number }}
        run: |
          {
            if [ -n "$SETTINGS_PR" ]; then
              echo "Settings changes are in #$SETTINGS_PR. Review and merge it before merging this PR."
            else
              echo 'No changes to the settings.'
            fi
            echo
            cat "$RUNNER_TEMP/changes.md"
          } > "$RUNNER_TEMP/comment.md"

      - name: Find Comment
        uses: peter-evans/find-comment@v4
        id: find-comment
        if: env.IS_FORK == 'false' && env.PR_NUMBER != '' && steps.version-check.outputs.version_changed == 'true'
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'

      - name: Create or update comment
        uses: peter-evans/create-or-update-comment@v5
        if: env.IS_FORK == 'false' && env.PR_NUMBER != '' && steps.version-check.outputs.version_changed == 'true'
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: ${{ runner.temp }}/comment.md
          edit-mode: replace

      # So that Renovate doesn't automerge an update whose settings need review.
      - name: Fail if the settings need review
        if: steps.changed-settings.outputs.changed == 'true'
        run: |
          if [ "$IS_FORK" = 'true' ]; then
            echo "::error::The settings need to be updated, see the job summary."
          else
            echo "::error::The settings need review, see the settings PR."
          fi
          exit 1
